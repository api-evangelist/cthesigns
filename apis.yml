aid: cthesigns
name: C the Signs
description: >-
  C the Signs is a London-based healthcare technology company, founded in 2016 by
  Dr Bea Bakshi and Dr Miles Payling, that uses artificial intelligence to help
  clinicians detect and refer patients at risk of cancer at the earliest, most
  treatable stage. Registered as an MHRA Class I medical device, its clinical
  decision support platform analyzes more than 1,000 validated, evidence-based
  data points across signs, symptoms and risk factors to recommend the right
  investigations or urgent referrals in under 60 seconds. The platform is used
  widely across the UK's NHS and health systems, has helped identify over 70,000
  patients with cancer across 100+ cancer types at reported 99% sensitivity, and
  is backed by an $8M Series A investment from Khosla Ventures. It has no public
  developer API; this profile tracks the company as an API Evangelist network lead.
